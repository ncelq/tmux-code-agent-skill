services:
  code-agent:
    build: .
    restart: unless-stopped
    ports:
      - "7860:7860"
    tty: true
    stdin_open: true
    volumes:
      - ~/.code_agent/data:/opt/data 
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - CURSOR_API_KEY=${CURSOR_API_KEY}
      # Route the npm cache (used by `pi update`) to a coder-writable path.
      - NPM_CONFIG_CACHE=/data/.npm